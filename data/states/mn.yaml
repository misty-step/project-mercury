    source_id: mn-120a22
    checked_on: "2026-11-05"
  - field: pathways.accredited.teacher_qualifications
    value: "Providing instruction in a state-recognized accredited school is an instructor-qualification option."
    quote: "provide instruction in a school that is accredited by an accrediting agency, recognized according to section"
