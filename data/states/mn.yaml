    checked_on: "2026-11-05"
  - field: funding
    value: "Qualifying home-school expenses may receive a K-12 education tax credit or subtraction."
    quote: "You may qualify for the Minnesota K-12 Education Subtraction and Credit if you home school your children."
    provenance: measured
    source_id: mn-revenue-homeschool
    checked_on: "2026-11-05"
  - field: public_school_access
    value: "Resident homeschool students are eligible for extracurricular activities on the same basis as public students; the statutory definition covers home schools with five or fewer students."
