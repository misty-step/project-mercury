code: "OR"
name: "Oregon"
summary: "Families notify their education service district and arrange testing at grades 3, 5, 8 and 10, with disability-plan alternatives. Parent-directed home instruction and instruction by a private teacher are separate attendance exemptions."
compulsory_ages:
  min: 6
  max: 17
pathways:
  -
    id: "parent-home-instruction"
    name: "Education at home by a parent or legal guardian"
    summary: "A parent or legal guardian educates the child at home under ORS 339.030(1)(e) and 339.035."
    notice:
      required: true
      detail: "Notify the local ESD within 10 days of starting the school year or withdrawing; notify the ESD when moving districts."
    approval:
      required: false
      detail: "No program approval required; the ESD acknowledges the notice."
    assessment:
      required: true
      detail: "Test in grades 3, 5, 8 and 10; retain results and submit if requested. IEP/PDP progress evaluation may replace tests; low scores trigger retests."
    subjects:
      required: false
      detail: "No prescribed homeschool subjects or approved curriculum."
    instruction_time:
      required: false
      detail: "No minimum days or hours for parent-directed home instruction."
    teacher_qualifications:
      required: false
      detail: "No minimum parent credential; declining test scores can lead to licensed supervision or a return-to-school order."
    records:
      required: true
      detail: "Retain test results and submit them to the ESD on request; submit required private disability-plan evaluations instead where applicable."
  -
    id: "private-teacher"
    name: "Instruction by a private teacher"
    summary: "A private teacher provides the usual public-school courses for an equivalent period under ORS 339.030(1)(d)."
    notice:
      required: true
      detail: "Notify the local ESD within 10 days of starting the school year or withdrawing; notify the ESD when moving districts."
    approval:
      required: false
      detail: "No program approval required; the ESD acknowledges the notice."
    assessment:
      required: true
      detail: "Test in grades 3, 5, 8 and 10; disability-plan evaluations may replace tests. Low scores trigger further testing and possible supervision."
    subjects:
      required: true
      detail: "Teach the courses of study usually taught in public-school kindergarten through grade 12."
    instruction_time:
      required: true
      detail: "Instruction must cover a period equivalent to that required for children attending public schools."
    teacher_qualifications:
      required: false
      detail: "No general teaching license requirement; declining test scores can lead to supervision by a licensed teacher."
    records:
      required: true
      detail: "Retain test results and submit them to the ESD on request; submit required private disability-plan evaluations instead where applicable."
claims:
