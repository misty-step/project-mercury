    field: "compulsory_ages"
    value: "Generally ages 6–17, with six measured by September 1; an enrolled five-year-old must attend while enrolled."
    quote: "all children between the ages of 6 and 18 years who have not completed the 12th grade are required to regularly attend a public full-time school during the entire school term."
    provenance: "measured"
    source_id: "or-attendance-home-instruction"
    checked_on: "2026-11-05"
  -
    field: "compulsory_ages"
    value: "A child counts as six if the sixth birthday occurred on or before September 1 before the current term."
    quote: "a child is considered to be six years of age if the sixth birthday of the child occurred on or before September 1 immediately preceding the beginning of the current school term."
    provenance: "measured"
    source_id: "or-attendance-home-instruction"
    checked_on: "2026-11-05"
