code: "TX"
name: "Texas"
summary: "Home schools are treated as private schools and must provide a course of study covering reading, spelling, grammar, mathematics, and good citizenship. Texas does not require home-school registration or program approval."
compulsory_ages:
  min: 6
  max: 18
pathways:
  -
    id: "home-school"
    name: "Home school (private school)"
    summary: "Parents provide private education at home without state registration or approval."
    notice:
      required: false
      detail: "No initial or annual registration; withdraw in writing if leaving public school. A district may request written assurance of home schooling."
    approval:
      required: false
      detail: "Not required; TEA does not approve or accredit home-school programs."
    assessment:
      required: false
      detail: "No general testing or evaluation requirement; public-school transfer placement and UIL eligibility can involve testing."
    subjects:
      required: true
      detail: "Teach reading, spelling, grammar, mathematics, and good citizenship."
    instruction_time:
      required: false
      detail: "No state minimum days or hours for a home school."
    teacher_qualifications:
      required: false
      detail: "No state teacher credential or parent diploma requirement."
    records:
      required: false
      detail: "No general attendance or portfolio requirement; keeping curriculum and progress records is useful for transfers."
funding:
  available: true
  detail: "Texas Education Freedom Accounts provide accepted homeschool students a $2,000 annual award for approved education expenses in 2026–27."
public_school_access:
  available: true
  detail: "Eligible homeschoolers may participate in UIL activities; if the resident district opts out, use the nearest district that has not opted out."
claims:
  -
    field: "pathways.home-school.notice"
    value: "No initial or annual registration; withdraw in writing if leaving public school. A district may request written assurance of home schooling."
    quote: "The TEA does not regulate, index, monitor, approve, register, or accredit the programs available to parents who choose to home school."
