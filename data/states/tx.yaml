    provenance: "inferred"
    source_id: "tx-tea-home"
    checked_on: "2026-11-05"
  -
    field: "pathways.home-school.notice"
    value: "A withdrawing public-school student should be disenrolled when the school receives written withdrawal notice."
    quote: "Students should be dis-enrolled by school officials when they receive written notice either by signing withdrawal forms or a letter of withdrawal."
    provenance: "measured"
    source_id: "tx-tea-policy"
    checked_on: "2026-11-05"
  -
    field: "pathways.home-school.notice"
    value: "Districts may request assurance that a child is being home schooled."
    quote: "School districts that become aware of a student who is potentially being home schooled may request in writing a letter of assurance from the parents that the student is being home schooled."
    provenance: "measured"
    source_id: "tx-tea-policy"
    checked_on: "2026-11-05"
  -
    field: "compulsory_ages"
    value: "Generally from the sixth birthday until the 19th birthday (ages 6–18 inclusive); earlier enrollment can trigger attendance, and statutory exemptions apply."
    quote: "Unless specifically exempted by Section 25.086, a child who is at least six years of age, or who is younger than six years of age and has previously been enrolled in first grade, and who has not yet reached the child's 19th birthday shall attend school."
    provenance: "measured"
    source_id: "tx-25-085"
    checked_on: "2026-11-05"
  -
    field: "funding"
    value: "The TEFA program provides a $2,000 annual award to accepted home-school students."
    quote: "Homeschool and other eligible nonpublic students will receive their full $2,000 annual award July 1."
    provenance: "measured"
    source_id: "tx-comptroller-tefa"
    checked_on: "2026-11-05"
  -
    field: "public_school_access"
    value: "State law guarantees eligible home-school students access at a participating district, with a resident-district opt-out."
    quote: "Homeschool students have a right to participate in UIL activities from the closest school district that has not opted out"
    provenance: "measured"
    source_id: "tx-tea-sb401"
    checked_on: "2026-11-05"
