code: MO
name: Missouri
summary: >-
  Families may operate an unfunded home school or a Family Paced Education school; both keep evidence of instruction and meet subject-hour requirements for children under 16. Eligible FPE students may instead use a MOScholars agreement, which satisfies compulsory attendance and adds scholarship reporting and testing conditions.
compulsory_ages: { min: 7, max: 16 }
pathways:
  - id: home-school
    name: Home school
    summary: A private or religious home school that charges no tuition and enrolls no MOScholars participants teaches the child under sections 167.012 and 167.031.
    notice: { required: false, detail: "No annual homeschool registration or intent filing; a written withdrawal request makes a public district remove the child promptly from its rolls." }
    approval: { required: false, detail: "No state or district approval; home education enforcement and records review belong to the local prosecuting attorney." }
    assessment: { required: false, detail: "No required standardized test or outside evaluation; keep evidence of academic progress for children under 16, such as evaluation records or equivalent evidence." }
    subjects: { required: true, detail: "Under age 16, at least 600 hours in reading, language arts, mathematics, social studies, science, or related age-appropriate academic courses." }
    instruction_time: { required: true, detail: "Under age 16, at least 1,000 instructional hours yearly, including 600 core-subject hours; at least 400 of the 600 at the regular home school location." }
    teacher_qualifications: { required: false, detail: "No parent teaching certificate or degree required." }
    records: { required: true, detail: "Under age 16, keep a plan book/diary, work portfolio, and progress-evaluation records, or equivalent written or credible evidence. Retain a daily log as a legal defense." }
  - id: fpe-school
    name: Family Paced Education school
    summary: A tuition-free private or religious FPE school may teach at home and may accept MOScholars participants, but scholarship participation is not required.
    notice: { required: false, detail: "No general annual FPE registration with the state or district; use written notice when requesting removal from public-school rolls." }
    approval: { required: false, detail: "No state or district approval of an ordinary FPE program; scholarship participation has separate eligibility conditions." }
    assessment: { required: false, detail: "No standardized test or outside evaluation for non-scholarship students; keep progress-evaluation records or equivalent evidence for children under 16." }
    subjects: { required: true, detail: "Under age 16, at least 600 hours in reading, language arts, mathematics, social studies, science, or related age-appropriate academic courses." }
    instruction_time: { required: true, detail: "Under age 16, at least 1,000 instructional hours yearly, including 600 core-subject hours; at least 400 of the 600 at the regular FPE school location." }
    teacher_qualifications: { required: false, detail: "No parent teaching certificate or degree required." }
    records: { required: true, detail: "Under age 16, keep a plan book/diary, work portfolio, and progress-evaluation records, or equivalent written or credible evidence." }
  - id: moscholars-fpe
    name: MOScholars agreement with an FPE school
    summary: An eligible student's parent signs an agreement with an educational assistance organization and uses a scholarship account at a partnered FPE school.
    notice: { required: true, detail: "Apply through an EAO and sign the account agreement; the EAO reports student information and test results to state agencies." }
    approval: { required: false, detail: "No district program approval; the EAO must accept the eligible student and partner with the FPE school before scholarship use." }
    assessment: { required: true, detail: "State achievement or nationally normed math/English tests in the grades tested statewide; the EAO reports annual results to state agencies." }
    subjects: { required: true, detail: "English language arts, mathematics, social studies, and science; FPE core-subject hour requirements also apply below age 16." }
    instruction_time: { required: true, detail: "FPE students under 16 receive 1,000 hours yearly, including 600 core hours, at least 400 of them at the regular FPE location." }
    teacher_qualifications: { required: false, detail: "No parent degree or teaching certificate required under the FPE definition; scholarship funds cannot pay relatives within the third degree." }
    records: { required: true, detail: "Maintain required FPE instructional evidence below age 16 and produce it on request; the EAO records and reports scholarship student information and test results." }
funding: { available: true, detail: "MOScholars accounts can fund eligible FPE students' curriculum, tutoring, and other approved costs through a partnered EAO; income/IEP eligibility and testing apply." }
public_school_access: { available: true, detail: "Home and FPE students may try out for resident public/charter athletics, fine arts, and integrated cocurriculars under equal rules; some course-linked activities require class participation." }
claims:
  - field: compulsory_ages
    value: "Attendance generally begins at 7 and ends at 17, or after 16 completed high-school credits; metropolitan districts may set a different statutory endpoint."
    quote: "between the ages of seven years and the compulsory attendance age for the district."
    provenance: measured
    source_id: mo-167031
    checked_on: "2026-11-05"
  - field: compulsory_ages
    value: "In nonmetropolitan cases the endpoint is age 17 or successful completion of 16 high-school credits."
    quote: "Seventeen years of age or having successfully completed sixteen credits towards high school graduation in all other cases."
    provenance: measured
    source_id: mo-167031
    checked_on: "2026-11-05"
  - field: compulsory_ages
    value: "A metropolitan district may lower its compulsory attendance age from 17 to 16 by resolution."
    quote: "The school board of a metropolitan school district for which the compulsory attendance age is seventeen years may adopt a resolution to lower the compulsory attendance age to sixteen years;"
    provenance: measured
    source_id: mo-167031
    checked_on: "2026-11-05"
