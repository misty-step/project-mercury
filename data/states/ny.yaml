code: "NY"
name: "New York"
summary: "Families submit annual notice and an individualized home instruction plan reviewed for regulatory compliance. Required subjects, instructional days and hours, quarterly reports, attendance records and annual assessments apply."
compulsory_ages:
  min: 6
  max: 16
pathways:
  - id: "home-instruction"
    name: "Home instruction"
    summary: "Parents provide instruction under 8 NYCRR 100.10 with an individualized home instruction plan and district compliance review."
    notice:
      required: true
      detail: "Notify the superintendent annually by July 1; new or midyear home instruction requires notice within 14 days of starting."
    approval:
      required: true
      detail: "The superintendent reviews the IHIP for compliance; deficiencies must be corrected and adverse decisions may be appealed."
    assessment:
      required: true
      detail: "Annual assessment: narrative allowed in grades 1–3 and alternate years in grades 4–8; approved standardized testing otherwise."
    subjects:
      required: true
      detail: "Grade-specific courses include English, math, science, history/geography, health, physical education and arts; civics and safety subjects also apply."
    instruction_time:
      required: true
      detail: "Provide the equivalent of 180 days; 900 hours yearly in grades 1–6 and 990 hours in grades 7–12."
    teacher_qualifications:
      required: false
      detail: "No specific teaching credentials required for parents or tutors; assessment administrators/evaluators have separate consent rules."
    records:
      required: true
      detail: "Keep attendance records available on request; submit an IHIP, quarterly progress reports and an annual assessment."
funding:
  available: false
  detail: "No statewide homeschool ESA or homeschool-expense tax benefit; families bear home instruction costs."
public_school_access:
  available: false
  detail: "No statewide right to part-time public classes or interscholastic sports; districts may permit clubs and some extracurricular activities."
claims:
  - field: "compulsory_ages"
    value: "Attendance begins the school year a child turns six by December 1 and continues through the school year they turn 16."
    quote: "shall be required to remain in attendance until the last day of session in the school year in which the minor becomes sixteen years of age."
    provenance: "measured"
    source_id: "ny-3205"
    checked_on: "2026-11-05"
  - field: "compulsory_ages"
    value: "Districts may extend attendance for nonemployed minors through the school year they turn 17; the statewide baseline ends in the year they turn 16."
    quote: "the board of education shall have power to require minors from sixteen to seventeen years of age who are not employed to attend upon full time day instruction until the last day of session in the school year in which the student becomes seventeen years of age."
    provenance: "measured"
    source_id: "ny-3205"
    checked_on: "2026-11-05"
  - field: "compulsory_ages"
    value: "Children turning six on or before December 1 begin instruction that September."
    quote: "a minor who becomes six years of age on or before the first of December in any school year shall be required to attend upon full time instruction from the first day that the appropriate public schools are in session in September of such school year"
    provenance: "measured"
    source_id: "ny-3205"
    checked_on: "2026-11-05"
  - field: "funding"
    value: "No statewide homeschool ESA or homeschool-expense tax benefit; families bear home instruction costs."
    quote: "School districts cannot claim State aid for students instructed at home."
    provenance: "inferred"
    source_id: "ny-nysed-faq"
    checked_on: "2026-11-05"
  - field: "public_school_access"
    value: "Home-instructed students cannot attend the district instructional program part-time."
    quote: "The legislature has not authorized part-time attendance and, therefore, a student instructed at home may not participate in the instructional program of the school district."
    provenance: "measured"
    source_id: "ny-nysed-faq"
    checked_on: "2026-11-05"
  - field: "public_school_access"
    value: "Interscholastic sports require public-school enrollment; clubs are not a guaranteed statewide access right."
    quote: "Commissioner's Regulation (CR) 135.4(c)(7) directs that a participant in interscholastic sports must be enrolled in the public school;"
    provenance: "inferred"
    source_id: "ny-nysed-faq"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.notice"
    value: "Notify the superintendent annually by July 1; new or midyear home instruction requires notice within 14 days of starting."
    quote: "shall annually provide written notice to the superintendent of schools of their school district of residence of their intention to educate their child at home by July 1st of each school year."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.approval"
    value: "The superintendent reviews the IHIP for compliance; deficiencies must be corrected and adverse decisions may be appealed."
    quote: "The superintendent of schools shall review the revised IHIP and shall notify the parents as to whether the revised IHIP complies with subdivisions (d) and (e) of this section"
    provenance: "inferred"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.assessment"
    value: "Annual assessment: narrative allowed in grades 1–3 and alternate years in grades 4–8; approved standardized testing otherwise."
    quote: "At the time of filing the fourth quarterly report as specified in the IHIP, the parent shall also file an annual assessment in accordance with this subdivision."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.subjects"
    value: "Grade-specific courses include English, math, science, history/geography, health, physical education and arts; civics and safety subjects also apply."
    quote: "For grades one through six: arithmetic, reading, spelling, writing, the English language, geography, United States history, science, health education, music, visual arts, physical education, bilingual education and/or English as a second language where the need is indicated."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.instruction_time"
    value: "Provide the equivalent of 180 days; 900 hours yearly in grades 1–6 and 990 hours in grades 7–12."
    quote: "The cumulative hours of instruction for grades 1 through 6 shall be 900 hours per year. The cumulative hours of instruction for grades 7 through 12 shall be 990 hours per year."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.teacher_qualifications"
    value: "No specific teaching credentials required for parents or tutors; assessment administrators/evaluators have separate consent rules."
    quote: "State law does not require any specific credentials for the person(s) providing home instruction."
    provenance: "measured"
    source_id: "ny-nysed-faq"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.records"
    value: "Keep attendance records available on request; submit an IHIP, quarterly progress reports and an annual assessment."
    quote: "Records of attendance shall be maintained by the parent and shall be made available to the school district upon request."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.notice"
    value: "Midyear starts and new residents must notify within 14 days of starting home instruction."
    quote: "shall provide written notice of their intention to educate their child at home within 14 days following the commencement of home instruction within the school district."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.records"
    value: "Submit the IHIP within four weeks of receiving the materials or by August 15, whichever is later."
    quote: "Within four weeks of the receipt of such materials, or by August 15th,"
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.records"
    value: "Provide quarterly reports on the dates specified in the IHIP."
    quote: "a quarterly report for each child shall be furnished by the parent to the school district."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.instruction_time"
    value: "Provide the substantial equivalent of 180 instructional days each school year."
    quote: "The substantial equivalent of 180 days of instruction shall be provided each school year."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.assessment"
    value: "Narrative evaluation may be used in grades 1–3 and no more often than every other school year in grades 4–8."
    quote: "This alternative form of evaluation may be used no more often than every other school year for these grades;"
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.subjects"
    value: "Grades 7–8 require English, history/geography, science, math, PE, health, art, music, practical arts and library skills."
    quote: "For grades seven and eight: English (two units); history and geography (two units); science (two units); mathematics (two units); physical education (on a regular basis); health education (on a regular basis); art (one-half unit); music (one-half unit); practical arts (on a regular basis); and library skills (on a regular basis)."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.subjects"
    value: "Grades 9–12 have cumulative English, social studies, mathematics, science, arts/music, health, PE and elective requirements."
    quote: "For grades 9 through 12: English (four units); social studies (four units), which includes one unit of American history, one-half unit in participation in government, and one- half unit of economics; mathematics (two units); science (two units); art and/or music (one unit); health education (one-half unit); physical education (two units); and three units of electives."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.subjects"
    value: "Patriotism/citizenship, substance-misuse education, highway/bicycle safety and fire/arson safety also must be covered."
    quote: "patriotism and citizenship; (b) health education regarding alcohol, drug and tobacco misuse; (c) highway safety and traffic regulations, including bicycle safety; and (d) fire and arson prevention and safety."
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.assessment"
    value: "Grades 1–3 may use a written narrative instead of a standardized test."
    quote: "for grades one through three, a written narrative prepared by a person specified in subparagraph (iii) of this paragraph;"
    provenance: "measured"
    source_id: "ny-100-10"
    checked_on: "2026-11-05"
