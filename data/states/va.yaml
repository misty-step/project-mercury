code: "VA"
name: "Virginia"
summary: "Parents can provide home instruction with annual notice and evidence of progress, use a superintendent-approved qualified tutor, or obtain a school-board religious exemption. The routes have different requirements."
compulsory_ages:
  min: 5
  max: 17
pathways:
  - id: "home-instruction"
    name: "Home instruction"
    summary: "Parents meet one of four eligibility options and submit annual notice and progress evidence."
    notice:
      required: true
      detail: "Notify the division superintendent by August 15 yearly with curriculum subject list and eligibility evidence; late starters comply within 30 days."
    approval:
      required: false
      detail: "No advance program approval; meet one of the four statutory options and file the required evidence."
    assessment:
      required: true
      detail: "Submit test scores or an accepted evaluation by August 1; exempt if under 6 on September 30 of the school year."
    subjects:
      required: false
      detail: "No fixed subject list; submit a list of the subjects you plan to teach."
    instruction_time:
      required: true
      detail: "Instruction follows the same number of days and hours per day as public schools."
    teacher_qualifications:
      required: true
      detail: "Meet one option: diploma, teaching qualification, curriculum/program, or evidence of ability to provide adequate education."
    records:
      required: true
      detail: "Submit curriculum/eligibility evidence and annual progress evidence; provide immunization proof on request, subject to exemptions."
  - id: "qualified-tutor"
    name: "Qualified tutor or teacher"
    summary: "A qualified, superintendent-approved tutor or teacher, who may be a parent, instructs the child."
    notice:
      required: true
      detail: "Seek approval of the tutor or teacher from the division superintendent; no annual home-instruction notice required."
    approval:
      required: true
      detail: "Division superintendent must approve the qualified tutor or teacher."
    assessment:
      required: false
      detail: "No annual testing or progress evaluation prescribed under this route."
    subjects:
      required: false
      detail: "No particular subjects prescribed by the tutor attendance provision."
    instruction_time:
      required: true
      detail: "Follow the same number of days and hours per day as public schools."
    teacher_qualifications:
      required: true
      detail: "Tutor or teacher must hold qualifications prescribed by the Board of Education."
    records:
      required: true
      detail: "Provide immunization proof to the superintendent on request, unless a religious or medical exception applies."
  - id: "religious-exemption"
    name: "Religious exemption"
    summary: "A school board excuses a child and parents conscientiously opposed to school attendance for bona fide religious reasons."
    notice:
      required: true
      detail: "Request a religious exemption from the local school board; not the annual home-instruction notice."
    approval:
      required: true
      detail: "School board must grant the exemption upon finding the statutory religious grounds."
    assessment:
      required: false
      detail: "No annual academic assessment required under the religious exemption."
    subjects:
      required: false
      detail: "No required subjects under the religious exemption."
    instruction_time:
      required: false
      detail: "No days or hours required once excused under the religious exemption."
    teacher_qualifications:
      required: false
      detail: "No diploma or teaching credential required under the religious exemption."
    records:
      required: true
      detail: "Provide immunization proof on request, or a religious affidavit or medical certification instead."
funding:
  available: false
  detail: "No general homeschool expense benefit; tax-credit scholarships are paid to eligible nonpublic schools, not home programs."
public_school_access:
  available: false
  detail: "No statewide entitlement to part-time classes or interscholastic sports; local class access policies vary."
claims:
