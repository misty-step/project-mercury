    value: "Attendance applies to children who turn 5 by September 30 until their 18th birthday; parents may defer an unready five-year-old for one year by notice."
    quote: "any child who will have reached the fifth birthday on or before September 30 of any school year and who has not passed the eighteenth birthday"
    provenance: "measured"
    source_id: "va-254"
    checked_on: "2026-11-05"
  - field: "pathways.home-instruction.notice"
