code: "CO"
name: "Colorado"
summary: "Families may use a nonpublic home-based program, enroll through an independent school, or use a Colorado-licensed teacher at home. The home-based program requires annual notice, specified instruction, records and periodic evaluations."
compulsory_ages:
  min: 6
  max: 16
pathways:
  - id: "home-based"
    name: "Nonpublic home-based educational program"
    summary: "A parent, guardian or designated adult relative teaches at home under section 22-33-104.5."
    notice:
      required: true
      detail: "Notify any Colorado district 14 days before starting and annually thereafter; notice starts at six, instruction at seven, and neither is required after sixteen."
    approval:
      required: false
      detail: "No prior program approval; a recently habitually truant child requires a curriculum description with the notice."
    assessment:
      required: true
      detail: "Nationally standardized test or qualified-person evaluation in grades 3, 5, 7, 9 and 11; submit results to the district or a Colorado independent/parochial school."
    subjects:
      required: true
      detail: "Reading, writing, speaking, math, history, civics, literature, science and the U.S. Constitution."
    instruction_time:
      required: true
      detail: "At least 172 instructional days per year, averaging four contact hours per day."
    teacher_qualifications:
      required: false
      detail: "No diploma or license required; instructor must be a parent, guardian or designated adult relative."
    records:
      required: true
      detail: "Keep permanent attendance, test/evaluation and immunization records; district may inspect on 14 days’ written notice with probable cause."
  - id: "independent-school"
    name: "Independent or parochial school enrollment"
    summary: "A family enrolls with an independent or parochial school that permits home instruction and follows its program."
    notice:
      required: false
      detail: "No parent homeschool notice; the school must report names, ages, residences and attendance to its local district if requested, at most monthly."
    approval:
      required: false
      detail: "No state or district program approval; enroll with the school and follow its requirements."
    assessment:
      required: false
      detail: "No state-mandated assessment for this route; the school may set its own requirements."
    subjects:
      required: true
      detail: "School must provide reading, writing, speaking, math, history, civics, literature, science, flag instruction and U.S. Constitution study."
    instruction_time:
      required: true
      detail: "Enroll for at least 172 days each year; follow the school’s instructional arrangements."
    teacher_qualifications:
      required: false
      detail: "No state teaching-license or parent-diploma requirement for this route; school requirements may differ."
    records:
      required: true
      detail: "School must maintain information needed for district-requested enrollment and attendance reports; families follow school record rules."
  - id: "licensed-teacher"
    name: "Home instruction by a licensed teacher"
    summary: "A Colorado-licensed teacher provides home instruction under the separate attendance exemption."
    notice:
      required: false
      detail: "No homeschool notice required under the separate licensed-teacher exemption."
    approval:
      required: false
      detail: "No prior program approval required under this exemption."
    assessment:
      required: false
      detail: "No statutory testing or evaluation requirement for this exemption."
    subjects:
      required: false
      detail: "No subjects specified by the licensed-teacher attendance exemption."
    instruction_time:
      required: false
      detail: "No minimum days or hours specified by this exemption."
    teacher_qualifications:
      required: true
      detail: "Teacher must hold a Colorado license under article 60.5 or 61."
    records:
      required: false
      detail: "No homeschool recordkeeping requirement specified by this exemption."
funding:
  available: false
  detail: "No state funding for homeschool expenses."
public_school_access:
  available: true
  detail: "Home-based students may participate equally in public-school extracurricular and interscholastic activities, subject to eligibility rules."
claims:
  - field: "compulsory_ages"
    value: "Attendance generally begins at six by August 1 and ends at seventeen; the home-based route permits instruction to begin at seven."
    quote: "every child who has attained the age of six years on or before August 1 of each year and is under the age of seventeen years"
    provenance: "measured"
    source_id: "co-attendance"
    checked_on: "2026-11-05"
  - field: "funding"
    value: "No state funding for homeschool expenses."
    quote: "There is no public funding available for homeschool."
    provenance: "measured"
    source_id: "co-home-faq"
    checked_on: "2026-11-05"
  - field: "public_school_access"
    value: "Home-based students may participate equally in public-school extracurricular and interscholastic activities, subject to eligibility rules."
    quote: "may participate on an equal basis in any extracurricular or interscholastic activity offered by a public school"
    provenance: "measured"
    source_id: "co-home-law"
    checked_on: "2026-11-05"
  - field: "pathways.home-based.notice"
    value: "Notify any Colorado district 14 days before starting and annually thereafter; notice starts at six, instruction at seven, and neither is required after sixteen."
    quote: "Written notification must be re-submitted to the school district each year."
    provenance: "measured"
    source_id: "co-home-faq"
    checked_on: "2026-11-05"
  - field: "pathways.home-based.approval"
    value: "No prior program approval; a recently habitually truant child requires a curriculum description with the notice."
    quote: "Homeschooling is deregulated in the state of Colorado."
    provenance: "inferred"
    source_id: "co-home-faq"
    checked_on: "2026-11-05"
  - field: "pathways.home-based.assessment"
    value: "Nationally standardized test or qualified-person evaluation in grades 3, 5, 7, 9 and 11; submit results to the district or a Colorado independent/parochial school."
    quote: "Each child participating in a nonpublic home-based educational program shall be evaluated when such child reaches grades three, five, seven, nine, and eleven."
    provenance: "measured"
    source_id: "co-home-law"
    checked_on: "2026-11-05"
  - field: "pathways.home-based.subjects"
    value: "Reading, writing, speaking, math, history, civics, literature, science and the U.S. Constitution."
    quote: "Subjects shall include, but is not limited to communication skills of reading, writing and speaking, mathematics, history, civics, literature, science, and regular courses of instruction in the constitution of the United States."
    provenance: "measured"
    source_id: "co-home-faq"
    checked_on: "2026-11-05"
  - field: "pathways.home-based.instruction_time"
    value: "At least 172 instructional days per year, averaging four contact hours per day."
    quote: "Attendance shall include no less than 172 days of instruction, averaging four instructional contact hours per day."
    provenance: "measured"
    source_id: "co-home-faq"
    checked_on: "2026-11-05"
  - field: "pathways.home-based.teacher_qualifications"
    value: "No diploma or license required; instructor must be a parent, guardian or designated adult relative."
    quote: "You must be the child's parent, legal guardian or an adult relative designated by the parent. (22-33-104.5(3)(a), C.R.S.) No other qualifications or licenses are required."
    provenance: "measured"
    source_id: "co-home-faq"
    checked_on: "2026-11-05"
  - field: "pathways.home-based.records"
