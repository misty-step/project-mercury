code: "FL"
name: "Florida"
summary: "Families may register a home education program, use a private umbrella school or certified tutor, or join a scholarship-funded personalized education program. The home education route requires a portfolio and annual evaluation; each alternative has different duties."
compulsory_ages:
  min: 6
  max: 15
pathways:
  - id: "home-education"
    name: "Home education program"
    summary: "A parent registers a parent-directed program with the county superintendent and documents annual educational progress."
    notice:
      required: true
      detail: "Send signed intent to the county superintendent within 30 days of starting; file termination and final evaluation within 30 days of ending."
    approval:
      required: false
      detail: "No prior approval; the superintendent must accept and immediately register a complete notice."
    assessment:
      required: true
      detail: "File annual evaluation: certified-teacher review, approved test, psychologist evaluation or agreed tool. Prior nonattendance may trigger 30-day portfolio reviews."
    subjects:
      required: false
      detail: "No prescribed subject list; instruction must be sequentially progressive."
    instruction_time:
      required: false
      detail: "No minimum days or hours; home education is excluded from school-day requirements."
    teacher_qualifications:
      required: false
      detail: "No Florida teaching certificate or parent diploma required."
    records:
      required: true
      detail: "Keep an educational activity/reading log and work samples for two years; allow superintendent inspection on 15 days’ written notice."
  - id: "private-school"
    name: "Private school enrollment"
    summary: "A family enrolls in a Florida private school offering home-based instruction and follows the school’s requirements."
    notice:
      required: true
      detail: "No parent homeschool notice; the private school registers with FDOE, files its annual survey and submits required attendance reports."
    approval:
      required: false
      detail: "No FDOE approval or accreditation; select a school that offers home-based enrollment."
    assessment:
      required: false
      detail: "No general statewide annual test; the school or a scholarship program may require testing."
    subjects:
      required: false
      detail: "No state-prescribed curriculum; follow the school’s program."
    instruction_time:
      required: true
      detail: "180 school days, or at least 170 days plus 540 hours in kindergarten, 720 in grades 1–3 or 900 in grades 4–12."
    teacher_qualifications:
      required: false
      detail: "No general state teaching-license requirement; school and scholarship-program standards may apply."
    records:
      required: true
      detail: "School keeps enrollment and daily attendance records, required reports and permanent student records."
  - id: "private-tutor"
    name: "Private tutoring program"
    summary: "A Florida-certified teacher provides private instruction, keeps attendance records and meets the statutory school term."
    notice:
      required: true
      detail: "Tutor makes required state and district reports, including regular attendance reports; no home-education intent filing."
    approval:
      required: false
      detail: "No separate program approval specified; tutor must meet certification, reporting and term requirements."
    assessment:
      required: false
      detail: "No annual test or evaluation requirement specified for the tutoring route."
    subjects:
      required: false
      detail: "No separate required subject list; tutor’s Florida certificate must cover the subjects or grades taught."
    instruction_time:
      required: true
      detail: "180 actual teaching days or the hourly equivalent under section 1011.60(2)."
    teacher_qualifications:
      required: true
      detail: "Tutor must hold a valid Florida certificate for the subjects or grades taught."
    records:
      required: true
      detail: "Tutor keeps enrollment and daily attendance registers and makes required state and district reports."
  - id: "personalized-education"
    name: "Personalized education program"
    summary: "A parent directs education while registered with an eligible scholarship-funding organization rather than the district."
    notice:
      required: true
      detail: "Register with a scholarship-funding organization, not the district; the organization submits required scholarship student information to FDOE."
    approval:
      required: false
      detail: "No district curriculum approval; the scholarship organization verifies eligibility and accepts the annual learning plan."
    assessment:
      required: true
      detail: "Take an FDOE-identified nationally norm-referenced test or state assessment; send results to the scholarship organization before renewal."
    subjects:
      required: false
      detail: "No prescribed subjects; parent develops and annually revises a student learning plan."
    instruction_time:
      required: false
      detail: "No minimum days or hours; PEP receives the school-day flexibility of home education."
    teacher_qualifications:
      required: false
      detail: "No parent diploma or teaching certificate required; paid tutors must meet applicable provider qualifications."
    records:
      required: true
      detail: "Submit an annual learning plan, sworn compliance statement and test results; retain documentation for scholarship purchases."
funding:
  available: true
  detail: "Personalized Education Program scholarships fund curriculum and other approved expenses; this is distinct from district-registered home education."
public_school_access:
  available: true
  detail: "Registered home education and PEP students may participate in public-school interscholastic extracurricular activities, subject to eligibility rules."
claims:
  - field: "compulsory_ages"
    value: "Attendance generally begins at six, including children turning six by February 1, and continues until sixteen; enrolled public-school students must formally declare withdrawal at sixteen."
    quote: "All children who have attained the age of 6 years or who will have attained the age of 6 years by February 1 of any school year or who are older than 6 years of age but who have not attained the age of 16 years, except as otherwise provided, are required to attend school regularly during the entire school term."
    provenance: "measured"
    source_id: "fl-compulsory-attendance"
    checked_on: "2026-11-05"
  - field: "funding"
    value: "PEP scholarships support parent-directed education outside full-time public or private school and may buy instructional materials and curriculum."
    quote: "The organization must verify that scholarship funds are used for:"
