code: "NH"
name: "New Hampshire"
summary: "Parents may direct home education under RSA 193-A, with declarations required only for public-school withdrawal or access. A separate Education Freedom Account route funds parent-directed education but requires named subjects and annual assessment."
compulsory_ages:
  min: 6
  max: 17
pathways:
  - id: "home-education"
    name: "Home education"
    summary: "A parent provides, coordinates or directs education for their own child under RSA 193-A, as revised effective July 1, 2026."
    notice:
      required: true
      detail: "No routine declaration; required upon public-school withdrawal or to access public-school programs."
    approval:
      required: false
      detail: "No state or district approval required."
    assessment:
      required: false
      detail: "No required tests or evaluations under RSA 193-A after the July 1, 2026 revision."
    subjects:
      required: false
      detail: "No subjects prescribed under the revised RSA 193-A."
    instruction_time:
      required: false
      detail: "No minimum days or hours prescribed; the program need not follow the district calendar."
    teacher_qualifications:
      required: false
      detail: "No diploma, degree or teaching credential required for the parent."
    records:
      required: false
      detail: "No attendance log, portfolio or assessment records required under the revised RSA 193-A."
  - id: "education-freedom-account"
    name: "Education Freedom Account"
    summary: "Parents may direct education using an EFA without enrolling in a private school; this is legally separate from RSA 193-A home education."
    notice:
      required: true
      detail: "Apply to the scholarship organization; notify the resident district of EFA participation if accessing its public-school programs."
    approval:
      required: false
      detail: "No state/district program approval; the scholarship organization must approve EFA eligibility and the parent must sign its agreement."
    assessment:
      required: true
      detail: "Provide annual educational attainment through a national test, statewide assessment or teacher-evaluated portfolio."
    subjects:
      required: true
      detail: "Teach science, math, language, government, history, health, reading, writing, spelling, NH/US constitutional history, and art/music appreciation."
    instruction_time:
      required: false
      detail: "No minimum instructional days or hours specified in the EFA agreement requirements."
    teacher_qualifications:
      required: false
      detail: "No parent diploma or teaching credential specified; a portfolio evaluator must be a certified teacher or current nonpublic-school teacher."
    records:
      required: true
      detail: "Submit annual attainment evidence; the portfolio option includes a reading log and samples of student work."
funding:
  available: true
  detail: "Education Freedom Accounts fund parent-directed education under a separate legal route; EFA students are not RSA 193-A home educated students."
public_school_access:
  available: true
  detail: "Resident-district courses and cocurricular programs, including athletics, are open under no-more-restrictive participation policies; submit a declaration."
claims:
  - field: "compulsory_ages"
    value: "Attendance applies at ages 6 through 17."
    quote: "A parent of any child at least 6 years of age and under 18 years of age shall cause such child to attend the public school to which the child is assigned in the child's resident district."
    provenance: "measured"
    source_id: "nh-193"
    checked_on: "2026-11-05"
  - field: "compulsory_ages"
    value: "Children turning six after September 30 start the following school year."
    quote: "A child who reaches the sixth birthday after September 30 shall not be required to attend school under the provisions of this section until the following school year."
    provenance: "measured"
    source_id: "nh-193"
    checked_on: "2026-11-05"
  - field: "funding"
    value: "Education Freedom Accounts fund parent-directed education under a separate legal route; EFA students are not RSA 193-A home educated students."
    quote: "Nothing in this chapter shall be construed to require that an EFA student must be enrolled, full- or part-time, in either a private school or nonpublic online school."
    provenance: "inferred"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "funding"
    value: "EFA money pays for textbooks, curriculum and instructional materials."
    quote: "Textbooks, curriculum, or other instructional materials, including, but not limited to, any supplemental materials or associated online instruction required by either a curriculum or an education service provider."
    provenance: "measured"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "public_school_access"
    value: "Resident-district courses and cocurricular programs, including athletics, are open under no-more-restrictive participation policies; submit a declaration."
    quote: "Nonpublic, public chartered school, education freedom account, or home educated pupils shall have access to curricular courses and cocurricular programs offered by the school district in which the pupil resides, including the statewide assessment and preliminary scholastic aptitude test (PSAT)."
    provenance: "measured"
    source_id: "nh-193"
    checked_on: "2026-11-05"
  - field: "pathways.home-education.notice"
    value: "No routine declaration; required upon public-school withdrawal or to access public-school programs."
    quote: "A declaration of home education shall not be required, except to obtain access to public school programs pursuant to RSA 193:1-c or upon withdrawal from a public school."
    provenance: "measured"
    source_id: "nh-193-a"
    checked_on: "2026-11-05"
  - field: "pathways.home-education.approval"
    value: "No state or district approval required."
    quote: "A parent shall have the right to establish a home education program for his or her own child, regardless of ability, disability, developmental status, or educational needs."
    provenance: "inferred"
    source_id: "nh-193-a"
    checked_on: "2026-11-05"
  - field: "pathways.home-education.assessment"
    value: "No required tests or evaluations under RSA 193-A after the July 1, 2026 revision."
    quote: "Use the lack of notice, records, evaluations, or assessments in a home education program operated consistent with this chapter as a failure to provide education as required by law."
    provenance: "inferred"
    source_id: "nh-193-a"
    checked_on: "2026-11-05"
  - field: "pathways.home-education.subjects"
    value: "No subjects prescribed under the revised RSA 193-A."
    quote: "A parent shall have the right to establish a home education program for his or her own child, regardless of ability, disability, developmental status, or educational needs."
    provenance: "inferred"
    source_id: "nh-193-a"
    checked_on: "2026-11-05"
  - field: "pathways.home-education.instruction_time"
    value: "No minimum days or hours prescribed; the program need not follow the district calendar."
    quote: "Dates and hours of instruction shall not be required to coincide with the resident district calendar. The academic term of a home education program shall not be required to coincide with the resident district academic year."
    provenance: "inferred"
    source_id: "nh-193-a"
    checked_on: "2026-11-05"
  - field: "pathways.home-education.teacher_qualifications"
    value: "No diploma, degree or teaching credential required for the parent."
    quote: "A parent shall have the right to establish a home education program for his or her own child, regardless of ability, disability, developmental status, or educational needs."
    provenance: "inferred"
    source_id: "nh-193-a"
    checked_on: "2026-11-05"
  - field: "pathways.home-education.records"
    value: "No attendance log, portfolio or assessment records required under the revised RSA 193-A."
    quote: "Use the lack of notice, records, evaluations, or assessments in a home education program operated consistent with this chapter as a failure to provide education as required by law."
    provenance: "inferred"
    source_id: "nh-193-a"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.notice"
    value: "Apply to the scholarship organization; notify the resident district of EFA participation if accessing its public-school programs."
    quote: "If the student is accessing programs pursuant to 193:1-c, a parent shall notify the resident district that the student is now participating in the EFA program."
    provenance: "measured"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.approval"
    value: "No state/district program approval; the scholarship organization must approve EFA eligibility and the parent must sign its agreement."
    quote: "The signed agreement between the parent and the scholarship organization shall satisfy the compulsory school attendance requirements of RSA 193:1."
    provenance: "inferred"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.assessment"
    value: "Provide annual educational attainment through a national test, statewide assessment or teacher-evaluated portfolio."
    quote: "To provide an annual record of educational attainment by:"
    provenance: "inferred"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.subjects"
    value: "Teach science, math, language, government, history, health, reading, writing, spelling, NH/US constitutional history, and art/music appreciation."
    quote: "To provide an education for the eligible student in the core knowledge domains that include science, mathematics, language, government, history, health, reading, writing, spelling, the history of the constitutions of New Hampshire and the United States, and an exposure to and appreciation of art and music."
    provenance: "measured"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.instruction_time"
    value: "No minimum instructional days or hours specified in the EFA agreement requirements."
    quote: "The signed agreement between the parent and the scholarship organization shall satisfy the compulsory school attendance requirements of RSA 193:1."
    provenance: "inferred"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.teacher_qualifications"
    value: "No parent diploma or teaching credential specified; a portfolio evaluator must be a certified teacher or current nonpublic-school teacher."
    quote: "The signed agreement between the parent and the scholarship organization shall satisfy the compulsory school attendance requirements of RSA 193:1."
    provenance: "inferred"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.records"
    value: "Submit annual attainment evidence; the portfolio option includes a reading log and samples of student work."
    quote: "Maintaining a portfolio including, but not limited to, a log which designates by title the reading materials used; samples of writings, worksheets, workbooks, or creative materials used or developed by the student."
    provenance: "measured"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "public_school_access"
    value: "Cocurricular access includes athletics."
    quote: "In this section, \"cocurricular\" shall include those activities which are designed to supplement and enrich regular academic programs of study, provide opportunities for social development, and encourage participation in clubs, athletics, performing groups, and service to school and community."
    provenance: "measured"
    source_id: "nh-193"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.assessment"
    value: "The national test option requires annual achievement-test results submitted to the scholarship organization."
    quote: "Having the student take a nationally-standardized, norm-referenced achievement test and to provide the results to the scholarship organization by the end of each school year"
    provenance: "measured"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.assessment"
    value: "The statewide student assessment is another annual-assessment option."
    quote: "Having the student take the statewide student assessment test pursuant to RSA 193-C:6;"
    provenance: "measured"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.assessment"
    value: "A portfolio must be evaluated by a certified teacher or current nonpublic-school teacher."
    quote: "The parent shall have a certified teacher or a teacher currently teaching in a nonpublic school, who is selected by the parent, evaluate the student's educational progress upon review of a portfolio and discussion with the parent or student."
    provenance: "measured"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
  - field: "pathways.education-freedom-account.teacher_qualifications"
    value: "The parent need not hold a credential, but the portfolio evaluator must be a certified teacher or current nonpublic-school teacher."
    quote: "The parent shall have a certified teacher or a teacher currently teaching in a nonpublic school, who is selected by the parent, evaluate the student's educational progress upon review of a portfolio and discussion with the parent or student."
    provenance: "inferred"
    source_id: "nh-194-f"
    checked_on: "2026-11-05"
