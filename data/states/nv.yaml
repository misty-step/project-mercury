code: "NV"
name: "Nevada"
summary: "Parents file a notice of intent and an educational plan with their resident district to homeschool. The plan covers named subjects, but Nevada does not impose routine testing, parent credentials or a fixed homeschool schedule."
compulsory_ages:
  min: 6
  max: 17
pathways:
  - id: "homeschool"
    name: "Homeschool"
    summary: "A parent assumes educational responsibility and files a notice and educational plan with the resident district superintendent."
    notice:
      required: true
      detail: "File before starting, within 10 days of public-school withdrawal or 30 days of residency; refile within 30 days of a name/address change."
    approval:
      required: false
      detail: "A compliant notice must be accepted; the district acknowledges receipt rather than approving the program."
    assessment:
      required: false
      detail: "No routine standardized test or evaluation required to homeschool."
    subjects:
      required: true
      detail: "Plan English language arts, math, science and social studies, including history, geography, economics and government; not every subject every year."
    instruction_time:
      required: false
      detail: "No minimum homeschool days or hours prescribed."
    teacher_qualifications:
      required: false
      detail: "No parent diploma, degree or teaching credential required."
    records:
      required: true
      detail: "Submit the educational plan with the notice; be prepared to present the plan and proof of the child’s identity to a court."
funding:
  available: false
  detail: "No funded homeschool ESA or homeschool-expense tax benefit; Educational Choice Scholarships pay schools, not independent home education."
public_school_access:
  available: true
  detail: "Eligible homeschoolers have public-class access if space is available and a right to interscholastic activities; file a current participation notice."
claims:
  - field: "compulsory_ages"
    value: "Attendance is required from age 6 until age 18, unless the child has graduated."
    quote: "having control or charge of any child between the ages of 6 and 18 years shall enroll the child in a public school"
    provenance: "inferred"
    source_id: "nv-392"
    checked_on: "2026-11-05"
  - field: "funding"
    value: "No funded homeschool ESA or homeschool-expense tax benefit; Educational Choice Scholarships pay schools, not independent home education."
    quote: "A grant provided on behalf of a pupil pursuant to subsection 1 must be paid directly to the school chosen by the parent or legal guardian of the pupil."
    provenance: "inferred"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "public_school_access"
    value: "Homeschooled children have a statutory right to interscholastic activities subject to eligibility rules and annual participation notice."
    quote: "A homeschooled child must be allowed to participate in interscholastic activities and events in accordance with the regulations adopted by the Nevada Interscholastic Activities Association"
    provenance: "measured"
    source_id: "nv-385b"
    checked_on: "2026-11-05"
  - field: "public_school_access"
    value: "Public-school classes and nonsports extracurricular activities must be allowed if space, qualifications and current participation notice requirements are met."
    quote: "the board of trustees of the school district in which the child resides shall authorize the child to participate in any classes and extracurricular activities, excluding sports, at a public school within the school district if:"
    provenance: "inferred"
    source_id: "nv-392"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.notice"
    value: "File before starting, within 10 days of public-school withdrawal or 30 days of residency; refile within 30 days of a name/address change."
    quote: "The notice of intent to homeschool must be filed before beginning to homeschool the child or:"
    provenance: "inferred"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.approval"
    value: "A compliant notice must be accepted; the district acknowledges receipt rather than approving the program."
    quote: "Each superintendent of schools of a school district shall accept notice of intent to homeschool that is filed with the superintendent pursuant to this section and meets the requirements of subsection 5, and shall not require or request any additional information or assurances from the parent who filed the notice."
    provenance: "inferred"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.assessment"
    value: "No routine standardized test or evaluation required to homeschool."
    quote: "Each superintendent of schools of a school district shall accept notice of intent to homeschool that is filed with the superintendent pursuant to this section and meets the requirements of subsection 5, and shall not require or request any additional information or assurances from the parent who filed the notice."
    provenance: "inferred"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.subjects"
    value: "Plan English language arts, math, science and social studies, including history, geography, economics and government; not every subject every year."
    quote: "The parent of a child who is being homeschooled shall prepare an educational plan of instruction for the child in the subject areas of English language arts, mathematics, science and social studies, including history, geography, economics and government, as appropriate for the age and level of skill of the child as determined by the parent."
    provenance: "measured"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.instruction_time"
    value: "No minimum homeschool days or hours prescribed."
    quote: "Each superintendent of schools of a school district shall accept notice of intent to homeschool that is filed with the superintendent pursuant to this section and meets the requirements of subsection 5, and shall not require or request any additional information or assurances from the parent who filed the notice."
    provenance: "inferred"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.teacher_qualifications"
    value: "No parent diploma, degree or teaching credential required."
    quote: "Each superintendent of schools of a school district shall accept notice of intent to homeschool that is filed with the superintendent pursuant to this section and meets the requirements of subsection 5, and shall not require or request any additional information or assurances from the parent who filed the notice."
    provenance: "inferred"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.records"
    value: "Submit the educational plan with the notice; be prepared to present the plan and proof of the child’s identity to a court."
    quote: "The parent must be prepared to present the educational plan of instruction and proof of the identity of the child to a court of law if required by the court."
    provenance: "measured"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.notice"
    value: "After withdrawal file within 10 days; new Nevada residents file within 30 days."
    quote: "Not later than 10 days after the child has been formally withdrawn from enrollment in public school; or"
    provenance: "measured"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.notice"
    value: "New Nevada residents file within 30 days."
    quote: "Not later than 30 days after establishing residency in this State."
    provenance: "measured"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.notice"
    value: "Refile within 30 days after the parent or child’s name or address changes."
    quote: "If the name or address of the parent or child as indicated on a notice of intent to homeschool changes, the parent must, not later than 30 days after the change, file a new notice of intent to homeschool"
    provenance: "measured"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
  - field: "pathways.homeschool.subjects"
    value: "Each subject need not be taught every year."
    quote: "This section does not require a parent to ensure that each subject area is taught each year that the child is homeschooled."
    provenance: "measured"
    source_id: "nv-388d"
    checked_on: "2026-11-05"
