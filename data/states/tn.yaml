    checked_on: "2026-11-05"
  -
    field: "public_school_access"
    value: "LEAs must permit eligible home-school students to participate in interscholastic athletics."
    quote: "then the LEA shall permit participation in interscholastic athletics at those schools by home school students who satisfy the eligibility requirements established by the organization or association."
