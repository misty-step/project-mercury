    checked_on: "2026-11-05"
  -
    field: "funding"
    value: "The Individualized Education Account Program supports eligible students’ home schooling."
    quote: "The IEA Program supports families by providing scholarships for eligible students to attend a participating non-public school or to participate in home schooling."
    provenance: "measured"
    source_id: "tn-iea-eligibility"
    checked_on: "2026-11-05"
  -
    field: "funding"
    value: "Eligibility requires qualifying disabilities and one of the specified enrollment conditions."
    quote: "The student has an active Individualized Education Program (IEP) through a Tennessee public school district at the time of application* that identifies one or more of the following as primary or secondary disabilities."
    provenance: "measured"
    source_id: "tn-iea-eligibility"
    checked_on: "2026-11-05"
  -
    field: "funding"
    value: "IEA students and parents have additional program accountability duties."
    quote: "Assessment responsibilities"
