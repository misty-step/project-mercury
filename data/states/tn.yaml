    field: "pathways.church-affiliated.instruction_time"
    value: "Church-related schools follow the statutory 6½-hour instructional-day baseline."
    quote: "A local board of education, private school, or church-related school that exceeds the full six and one-half (6½) hours instructional time required by law by one-half (½) hour daily for the full academic year must be credited with the additional instructional time."
    provenance: "measured"
