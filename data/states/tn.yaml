  -
    field: "compulsory_ages"
    value: "General compulsory attendance covers ages 6–17 inclusive, with specific home-school exemptions at 6 or younger after notice and at age 17."
    quote: "Every parent, guardian or other legal custodian residing within this state having control or charge of any child or children between six (6) years of age and seventeen (17) years of age, both inclusive, shall cause the child or children to attend public or nonpublic school"
    provenance: "measured"
    source_id: "tn-49-6-3001"
    checked_on: "2026-11-05"
  -
    field: "compulsory_ages"
    value: "A home-school student who has reached 17 is exempt from the general attendance requirement."
    quote: "A student enrolled in a home school who has reached seventeen (17) years of age."
    provenance: "measured"
    source_id: "tn-49-6-3001"
    checked_on: "2026-11-05"
  -
    field: "compulsory_ages"
    value: "A child 6 or younger is exempt after a home-school notice is filed with the LEA or church-related school director."
    quote: "Is six (6) years of age or younger and whose parent or guardian has filed a notice of intent to conduct a home school with the director of the LEA or with the director of a church-related school;"
