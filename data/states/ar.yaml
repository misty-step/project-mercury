code: "AR"
name: "Arkansas"
summary: "Parents or legal guardians may homeschool by filing an annual notice with their local superintendent. State law does not prescribe curriculum, instructional hours, parent credentials, or routine homeschool testing; optional funding and activity participation have additional conditions."
compulsory_ages:
  min: 5
  max: 17
pathways:
  - id: "home-school"
    name: "Home school"
    summary: "A parent or legal guardian takes responsibility for the child’s education and submits the annual notice of intent."
    notice:
      required: true
      detail: "File by August 15 annually; normally 5 school days before public-school withdrawal; new district residents file within 30 days."
    approval:
      required: false
      detail: "No routine program approval; special withdrawal rules apply during disciplinary action or while school property remains outstanding."
    assessment:
      required: false
      detail: "No routine testing or evaluation required; optional EFA funding and public-school activities have separate conditions."
    subjects:
      required: false
      detail: "No state-prescribed subject list for ordinary home schooling."
    instruction_time:
      required: false
      detail: "No state-prescribed days or instructional hours for ordinary home schooling."
    teacher_qualifications:
      required: false
      detail: "No parent diploma or teaching certificate minimum prescribed."
    records:
      required: false
      detail: "No ongoing attendance, portfolio, or grade-record requirement; the annual notice is required."
funding:
  available: true
  detail: "EFA funds can pay homeschool expenses; K–10 participants take approved literacy/math tests and report by June 30, with disability alternatives."
public_school_access:
  available: true
  detail: "Homeschooled students may pursue resident public-school interscholastic activities, with notice, academic eligibility and participation conditions."
claims:
  - field: "compulsory_ages"
    value: "The statute covers children age five through seventeen on the enrollment cutoff date; a signed kindergarten waiver may defer kindergarten."
    quote: "having custody or charge of a child five (5) years of age through seventeen (17) years of age on or before the date established in § 6-18-207 for the minimum age for enrollment in public school"
    provenance: "measured"
    source_id: "ar-compulsory"
    checked_on: "2026-11-05"
  - field: "funding"
    value: "Education Freedom Accounts can pay approved homeschool curriculum and other educational expenses; participating families follow EFA rules."
    quote: "The Arkansas EFA program provides funding that families can use for approved educational expenses such as private school tuition, homeschool curriculum, tutoring, educational therapies, and other qualifying services."
    provenance: "measured"
    source_id: "ar-education-freedom-accounts"
    checked_on: "2026-11-05"
  - field: "public_school_access"
