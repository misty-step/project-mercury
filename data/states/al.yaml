    quote: "Nonpublic schools, including private, church, parochial, and religious schools, offering educational instruction in grades K-12, as well as home-schooled students, are not subject to licensure or regulation by the state or any political subdivision of the state, including the State Department of Education."
    provenance: "inferred"
    source_id: "al-autonomy"
    checked_on: "2026-11-05"
  - field: "pathways.church-school.records"
    value: "Church school keeps an enrollment and attendance register, recording absences of a half day or more."
    quote: "The principal teacher of each public school, private school, church school and each private tutor shall keep an attendance register showing the enrollment of the school and every absence of each enrolled child from school for a half day or more during each school day of the year."
    provenance: "measured"
    source_id: "al-attendance-records"
