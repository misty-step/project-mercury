code: MD
name: Maryland
summary: >-
  Families provide regular, thorough home instruction under local school-system review or a registered nonpublic supervising school or church institution. All routes require advance notice; local supervision requires a portfolio and semester reviews.
compulsory_ages: { min: 5, max: 17 }
pathways:
  - id: local-review
    name: Home instruction under local school-system supervision
    summary: The parent provides instruction and maintains a portfolio reviewed by the local superintendent or designee.
    notice: { required: true, detail: "File the state-prescribed form with the local superintendent at least 15 days before starting; verify continuation before each school year and report status changes." }
    approval: { required: false, detail: "No advance program approval; the district reviews compliance and may require correction of deficiencies." }
    assessment: { required: true, detail: "Portfolio reviews at each semester's end, at mutually agreed times and places; no more than three reviews yearly. Standardized tests are optional." }
    subjects: { required: true, detail: "English, mathematics, science, social studies, art, music, health, and physical education." }
    instruction_time: { required: false, detail: "No fixed days or hours; instruction must occur regularly during the school year and last long enough to implement the program." }
    teacher_qualifications: { required: false, detail: "No teacher certification or minimum educational credential required." }
    records: { required: true, detail: "Keep a portfolio demonstrating instruction, with relevant materials and work samples. College report cards or transcripts may replace the portfolio for those courses." }
  - id: church-supervised
    name: Home instruction supervised by a church school or institution
    summary: A registered school or educational institution operated by a bona fide church supervises instruction through materials and parent conferences.
    notice: { required: true, detail: "File with the local superintendent at least 15 days before starting; the supervisor annually reports continuing, newly added, and departing students and status changes." }
    approval: { required: false, detail: "No district approval of the family's program; use a church supervising entity registered with MSDE." }
    assessment: { required: false, detail: "No state-required test or portfolio review; the supervisor holds preenrollment and periodic parent conferences and may set its own requirements." }
    subjects: { required: false, detail: "No separate enumerated subject list for this route; provide regular, thorough instruction in studies usually taught to same-age public school children." }
    instruction_time: { required: false, detail: "No fixed days or hours; regular, thorough instruction during the school year is required." }
    teacher_qualifications: { required: false, detail: "No parent teacher certification or minimum educational credential required." }
    records: { required: true, detail: "The supervisor must report student rosters and status changes to the local superintendent; no state-required parent portfolio under this route." }
  - id: nonpublic-supervised
    name: Home instruction supervised by an approved nonpublic school
    summary: An MSDE-approved nonpublic school supplies materials and assigns a school-based teacher to assist the family and document progress.
    notice: { required: true, detail: "File with the local superintendent at least 15 days before starting; the supervisor annually reports continuing, newly added, and departing students and status changes." }
    approval: { required: false, detail: "No separate approval of the family's program; the supervising nonpublic school must hold a State Board certificate of approval and register to supervise." }
    assessment: { required: true, detail: "An assigned school-based teacher assists by issuing progress reports, marking papers, and grading tests; no required state standardized test." }
    subjects: { required: false, detail: "No separate enumerated subject list for this route; provide regular, thorough instruction in studies usually taught to same-age public school children." }
    instruction_time: { required: false, detail: "No fixed days or hours; regular, thorough instruction during the school year is required." }
    teacher_qualifications: { required: false, detail: "No parent credential required; the supervising school assigns a school-based teacher to assist." }
    records: { required: true, detail: "The school-based teacher issues progress reports and marks papers and tests; the supervisor reports student rosters and changes to the superintendent." }
funding: { available: false, detail: "No general homeschool ESA or tax benefit identified; BOOST scholarships pay tuition at participating nonpublic schools, not a family's home instruction costs." }
public_school_access: { available: false, detail: "No statewide right to public school classes or sports. State testing is available on request; federal law separately allows eligible students to join JROTC." }
claims:
  - field: compulsory_ages
    value: "Compulsory attendance generally covers ages 5 through 17; review is not required for children turning 5 after September 1 of that school year."
    quote: "It states that each child who resides in Maryland and is 5 years old or older and under 18 shall attend a public school regularly during the entire school year."
    provenance: measured
    source_id: md-msde-faq
    checked_on: "2026-11-05"
  - field: compulsory_ages
    value: "A child turning 5 after September 1 need not have home instruction reviewed that school year."
    quote: "Local school systems and supervising entities are not required to review the home instruction program of a child who turns 5 years old after September 1 of the school year in which the parent or guardian seeks to begin a home instruction program."
    provenance: measured
    source_id: md-msde-faq
    checked_on: "2026-11-05"
  - field: compulsory_ages
    value: "The statute requires attendance from age 5 until the 18th birthday, subject to its exemptions."
    quote: "Except as otherwise provided in this section, each child who resides in this State and is 5 years old or older and under 18 shall attend a public school regularly during the entire school year."
    provenance: measured
    source_id: md-7-301
    checked_on: "2026-11-05"
  - field: pathways.local-review.notice
    value: "Initial notice goes to the local superintendent at least 15 days before instruction begins; continuation is verified annually."
    quote: "Annually thereafter, before the beginning of the school year, a parent or guardian shall verify the continuation of home schooling for his or her child with the local school superintendent or with the supervising nonpublic school or institution described in Regulation .05 of this chapter."
    provenance: measured
