code: "SC"
name: "South Carolina"
summary: "Families may use a qualifying home-school association or obtain district approval, with 180 instructional days and required subjects. An income-eligible family may instead educate at home through the separate Education Scholarship Trust Fund program."
compulsory_ages:
  min: 5
  max: 16
pathways:
  -
    id: "association"
    name: "Option 3: Association for home schools"
    summary: "Parents join a qualifying association with at least 50 members and follow its academic standards."
    notice:
      required: true
      detail: "Join a qualifying association; it reports student counts and grades to each district by January 30."
    approval:
      required: false
      detail: "No district or state approval of the individual program; association membership and compliance are required."
    assessment:
      required: false
      detail: "No standardized test or independent evaluation required; parents document progress in semiannual reports."
    subjects:
      required: true
      detail: "Reading, writing, mathematics, science, social studies; add composition and literature in grades 7–12."
    instruction_time:
      required: true
      detail: "At least 180 instructional days annually; no daily minimum hours under Option 3."
    teacher_qualifications:
      required: true
      detail: "The parent must hold at least a high school diploma or GED."
    records:
      required: true
      detail: "Keep a lesson/activity record, work-sample portfolio, and semiannual progress reports with attendance."
  -
    id: "scaihs"
    name: "Option 2: South Carolina Association of Independent Home Schools"
    summary: "Parents teach through SCAIHS and comply with its continuing academic standards."
    notice:
      required: true
      detail: "Join SCAIHS; it reports student counts and grade levels to the districts by January 30."
    approval:
      required: false
      detail: "No district or state approval of the individual program; maintain SCAIHS membership and compliance."
    assessment:
      required: false
      detail: "No state-mandated testing or evaluation; SCAIHS may impose its own academic requirements."
    subjects:
      required: true
      detail: "Reading, writing, mathematics, science, social studies; add composition and literature in grades 7–12."
    instruction_time:
      required: true
      detail: "At least 180 instructional days annually; no statutory daily-hour minimum for this option."
    teacher_qualifications:
      required: true
      detail: "The parent must hold at least a high school diploma or GED."
    records:
      required: false
      detail: "No separate state recordkeeping list under Option 2; comply with SCAIHS standards and its reporting requirements."
  -
    id: "district"
    name: "Option 1: District-approved home schooling"
    summary: "The resident district board approves and supervises a home-school program meeting statutory standards."
    notice:
      required: true
      detail: "Apply to the resident district board with program, materials, evaluation methods, and instruction location."
    approval:
      required: true
      detail: "Resident district board approval is required before using this route."
    assessment:
      required: true
      detail: "Annual statewide grade-level tests, semiannual progress assessments, and first-grade readiness testing where applicable."
    subjects:
      required: true
      detail: "Reading, writing, mathematics, science, social studies; add composition and literature in grades 7–12. Library access is required."
    instruction_time:
      required: true
      detail: "At least 180 days; each day at least 4½ hours, excluding lunch and recess."
    teacher_qualifications:
      required: true
      detail: "Parent must have at least a high school diploma or GED, or a bachelor’s degree."
    records:
      required: true
      detail: "Keep lesson records, work portfolio, and evaluations for inspection; submit semiannual attendance and progress reports."
  -
    id: "estf"
    name: "Education Scholarship Trust Fund"
    summary: "Income-eligible families may educate at home through an approved ESTF account instead of Options 1–3."
    notice:
      required: true
      detail: "Apply to the Department of Education for ESTF; annually attest to instruction, testing, and program conditions."
    approval:
      required: true
      detail: "The department must approve scholarship eligibility and available funding; the signed parent agreement then satisfies attendance."
    assessment:
      required: true
      detail: "Required academic progress assessments in grades 3–12, with disability exceptions; report scores to the department."
    subjects:
      required: true
      detail: "English/language arts including writing, mathematics, social studies, and science."
    instruction_time:
      required: false
      detail: "No fixed annual days or daily hours specified for the ESTF home-education agreement."
    teacher_qualifications:
      required: false
      detail: "No parent degree or credential specified; education service providers have separate eligibility rules."
    records:
      required: true
      detail: "Report required assessment results to the department and complete the ESTF testing report form."
funding:
  available: true
  detail: "ESTF supports eligible home education outside Options 1–3: $7,634 for 2026–27, household income up to 500% of federal poverty guidelines; assessments required."
public_school_access:
  available: true
  detail: "Options 1–3 students have access to eligible resident-school interscholastic activities after a full homeschool year; notify the superintendent before the season."
