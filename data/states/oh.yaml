code: "OH"
name: "Ohio"
summary: "Parents may direct home education by notifying the district and teaching six subject areas, without routine testing or hour requirements. A religious nonchartered school is a separate option with school standards and reporting."
compulsory_ages:
  min: 6
  max: 17
pathways:
  -
    id: "home-education"
    name: "Home education"
    summary: "A parent directs education and files notice with the resident district superintendent."
    notice:
      required: true
      detail: "Notify the resident superintendent within five calendar days of starting, moving districts or withdrawal; renew by August 30."
    approval:
      required: false
      detail: "No approval required; exemption begins when notice is received."
    assessment:
      required: false
      detail: "No routine tests or evaluations required under the home education statute."
    subjects:
      required: true
      detail: "Teach English language arts, mathematics, science, history, government and social studies."
    instruction_time:
      required: false
      detail: "No minimum days or hours specified."
    teacher_qualifications:
      required: false
      detail: "No diploma or teaching license required."
    records:
      required: false
      detail: "No attendance log or portfolio required; submit the notice."
  -
    id: "nonchartered-religious-school"
    name: "Nonchartered nonpublic school"
    summary: "A family may operate a nonchartered school because of truly held religious beliefs, meeting the statutory school standards."
    notice:
      required: true
      detail: "Report enrollment to the district treasurer within the first two school weeks; file annual standards certification with the state by September 30."
    approval:
      required: false
      detail: "No charter approval required for a school not seeking a charter because of truly held religious beliefs."
    assessment:
      required: false
      detail: "No standardized test or external evaluation required by these minimum standards."
    subjects:
      required: true
      detail: "Language arts; geography, U.S./Ohio history and government; math; science; health; PE; fine arts/music; first aid, safety and fire prevention."
    instruction_time:
      required: true
      detail: "Annual minimum: K 455 hours (910 all-day); grades 1–6 910; grades 7–12 1,001 under the statute."
    teacher_qualifications:
      required: true
      detail: "Teachers and administrators need a bachelor's degree or equivalent from a recognized college or university."
    records:
      required: true
      detail: "Submit pupil name, age and residence in enrollment/withdrawal reports and the annual minimum-standards certification."
claims:
  -
    field: "compulsory_ages"
    value: "Generally ages 6–17; an enrolled kindergartner under six is also covered unless formally withdrawn. Compulsory age starts with the district term."
    quote: "A child between six and eighteen years of age is \"of compulsory school age\""
    provenance: "measured"
    source_id: "oh-compulsory-age"
    checked_on: "2026-11-05"
  -
    field: "pathways.home-education.notice"
    value: "Notify the resident superintendent within five calendar days of starting, moving districts or withdrawal; renew by August 30."
    quote: "Within five calendar days after commencing home education, moving into a new school district, or withdrawing from a public or nonpublic school, and by the thirtieth day of August each year thereafter, the parent or guardian of a child receiving a home education shall transmit a notice to the superintendent of the child's school district of residence."
    provenance: "measured"
    source_id: "oh-home-education"
    checked_on: "2026-11-05"
  -
    field: "pathways.home-education.approval"
    value: "No approval required; exemption begins when notice is received."
    quote: "The child's exemption under this section is effective immediately upon receipt of notice."
    provenance: "inferred"
    source_id: "oh-home-education"
    checked_on: "2026-11-05"
  -
    field: "pathways.home-education.assessment"
    value: "No routine tests or evaluations required under the home education statute."
    quote: "A child receiving home education in the subject areas of English language arts, mathematics, science, history, government, and social studies is exempt from section"
