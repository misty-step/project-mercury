code: "UT"
name: "Utah"
summary: "Parents give their resident school board a one-time notice and control curriculum, schedule, and instruction without district approval. Families using Utah Fits All scholarships must also satisfy the scholarship’s annual accountability rules."
compulsory_ages:
  min: 6
  max: 17
pathways:
  -
    id: "home-school"
    name: "Home school"
    summary: "Parents provide home education after a one-time notification to their district of residence."
    notice:
      required: true
      detail: "Give the resident school board a one-time initial notice; no annual affidavit. Earlier notices remain valid."
    approval:
      required: false
      detail: "Not required; the board acknowledges the notice within 30 days rather than approving instruction."
    assessment:
      required: false
      detail: "No required standardized tests or district evaluations for unfunded home schools."
    subjects:
      required: false
      detail: "No mandated subjects or curriculum; parents choose materials and learning goals."
    instruction_time:
      required: false
      detail: "No required number of days or instructional hours."
    teacher_qualifications:
      required: false
      detail: "No teaching license, degree, or special training required."
    records:
      required: false
      detail: "Districts may not require instruction or attendance records."
funding:
  available: true
  detail: "Utah Fits All offers up to $4,000 at ages 5–11 or $6,000 at ages 12–18 (September 1 ages). Renewal requires a portfolio or assessment, normally by May 31; funds are limited."
public_school_access:
  available: true
  detail: "Home-school students may enroll in public school part-time and join academic activities on the same terms as their grade or age group."
claims:
  -
    field: "pathways.home-school.notice"
    value: "Give the resident school board a one-time initial notice; no annual affidavit. Earlier notices remain valid."
    quote: "When a parent withdraws an enrolled school-age child from school for the purpose of home-schooling, or chooses not to enroll a school-age child, the parent shall provide a one-time initial notification, that may include a letter of intent, to the local school board of the school-age child's district of residence."
    provenance: "measured"
    source_id: "ut-53g-6-204"
    checked_on: "2026-11-05"
  -
    field: "pathways.home-school.approval"
    value: "Not required; the board acknowledges the notice within 30 days rather than approving instruction."
    quote: "acknowledge receipt of the notification to the parent within 30 days"
    provenance: "inferred"
    source_id: "ut-53g-6-204"
    checked_on: "2026-11-05"
  -
    field: "pathways.home-school.assessment"
    value: "No required standardized tests or district evaluations for unfunded home schools."
    quote: "require standardized or other testing of home school students."
    provenance: "inferred"
    source_id: "ut-53g-6-204"
    checked_on: "2026-11-05"
  -
    field: "pathways.home-school.subjects"
    value: "No mandated subjects or curriculum; parents choose materials and learning goals."
    quote: "Utah does not require homeschool families to use a certain curriculum, textbook, or program. Parents may choose the learning materials and subjects that work best for their child."
    provenance: "inferred"
    source_id: "ut-usbe-home"
    checked_on: "2026-11-05"
  -
    field: "pathways.home-school.instruction_time"
    value: "No required number of days or instructional hours."
    quote: "Utah law does not require homeschool families to follow a set number of school days or instructional hours."
