    source_id: "ut-usbe-home"
    checked_on: "2026-11-05"
  -
    field: "pathways.home-school.teacher_qualifications"
    value: "No teaching license, degree, or special training required."
    quote: "Parents do not need a teaching license, college degree, or special training to homeschool their children."
