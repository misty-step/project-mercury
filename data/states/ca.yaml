code: "CA"
name: "California"
summary: "Families may establish a home-based private school, use an existing private school’s home program, or employ a credentialed tutor. Private schools file an annual affidavit and keep records; the tutor exemption has a credential and fixed instructional schedule."
compulsory_ages:
  min: 6
  max: 17
pathways:
  - id: "private-school"
    name: "Private full-time day school"
    summary: "A family operates a home-based private school or uses a private school’s home or satellite program."
    notice:
      required: true
      detail: "School files annual Private School Affidavit with CDE October 1–15; an umbrella school may file for its home program."
    approval:
      required: false
      detail: "No program approval; district verifies annual affidavit filing, not educational quality."
    assessment:
      required: false
      detail: "No state-required standardized testing or portfolio review; the private school may set its own assessments."
    subjects:
      required: true
      detail: "Offer public-school branches of study, normally in English; grade-band subjects are in Education Code 51210 and 51220."
    instruction_time:
      required: false
      detail: "Must be a full-time day school, but this exemption sets no numerical minimum days or hours."
    teacher_qualifications:
      required: true
      detail: "Instructors must be capable of teaching; no state credential or diploma minimum is specified."
    records:
      required: true
      detail: "Keep attendance showing half-day absences, courses offered, and faculty names, addresses and educational qualifications."
  - id: "credentialed-tutor"
    name: "Instruction by tutor"
    summary: "A person holding a valid California credential for the grade taught provides private instruction."
    notice:
      required: false
      detail: "No Private School Affidavit or separate notice required under the tutor exemption."
    approval:
      required: false
      detail: "No separate program approval required; instructor must hold the required state credential."
    assessment:
      required: false
      detail: "No standardized test or portfolio evaluation prescribed for the tutor exemption."
    subjects:
      required: true
      detail: "Teach the public-school branches of study in English."
    instruction_time:
      required: true
      detail: "At least 3 hours daily for 175 days each calendar year, between 8 a.m. and 4 p.m."
    teacher_qualifications:
      required: true
      detail: "Tutor or other instructor must hold a valid state credential for the grade taught."
    records:
      required: false
      detail: "No particular attendance or portfolio records prescribed by the tutor exemption."
funding:
  available: false
  detail: "No state ESA or homeschool-expense tax benefit for private home education; public charter and independent-study programs are public enrollment."
public_school_access:
  available: false
  detail: "No statewide right to part-time public classes or interscholastic sports for private homeschoolers; ask the district about available options."
claims:
  - field: "compulsory_ages"
    value: "Compulsory full-time education generally applies from age six until the eighteenth birthday."
    quote: "Each person between the ages of 6 and 18 years not exempted under the provisions of this chapter or Chapter 3"
    provenance: "inferred"
    source_id: "ca-compulsory"
    checked_on: "2026-11-05"
  - field: "funding"
    value: "The state does not provide funding for private homeschooling; no general home-education ESA or tax benefit is identified."
    quote: "Similar to private schools, the state does not oversee or provide any funding for these students."
    provenance: "inferred"
    source_id: "ca-funding-analysis"
    checked_on: "2026-11-05"
  - field: "public_school_access"
    value: "State law leaves nonconflicting local programs and activities to district boards rather than guaranteeing homeschool access."
    quote: "the governing board of any school district may initiate and carry on any program, activity, or may otherwise act in any manner which is not in conflict with or inconsistent with, or preempted by, any law"
    provenance: "inferred"
    source_id: "ca-district-discretion"
    checked_on: "2026-11-05"
  - field: "pathways.private-school.notice"
    value: "School files annual Private School Affidavit with CDE October 1–15; an umbrella school may file for its home program."
    quote: "private school instruction on the elementary or high school level shall between the first and 15th day of October of each year, commencing on October 1, 1967, file with the Superintendent of Public Instruction an affidavit or statement, under penalty of perjury,"
    provenance: "inferred"
