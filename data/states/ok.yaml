  -
    field: "funding"
    value: "A refundable Oklahoma income tax credit covers up to $1,000 per eligible homeschooled student in qualified expenses; claim with receipts."
    quote: "Beginning in tax year 2024, a refundable income tax credit of up to $1,000 per student is allowed for Oklahoma taxpayers who pay qualified expenses on behalf of an eligible student who is homeschooled."
    provenance: "measured"
    source_id: "ok-homeschool-credit"
    checked_on: "2026-11-05"
  -
    field: "public_school_access"
    value: "No homeschool-access entitlement is supplied by the attendance exemption; district boards govern local school options."
    quote: "Make rules, not inconsistent with the law or rules of the State Board of Education, governing the board and the school system of the district"
    provenance: "inferred"
    source_id: "ok-board-powers"
