code: "DE"
name: "Delaware"
summary: "Families may register a single-family or multi-family homeschool, or use the statutory district-coordinated option. Enrollment and annual attendance reports are required; only the district-coordinated route requires an approved curriculum."
compulsory_ages:
  min: 5
  max: 15
pathways:
  - id: "single-family"
    name: "Single-family homeschool"
    summary: "A parent or legal guardian primarily teaches their own child in their own residence."
    notice:
      required: true
      detail: "Register the homeschool and students with DDOE; file annual enrollment by September 30. Multi-family schools use a liaison."
    approval:
      required: false
      detail: "No instructional-program approval required; DDOE reviews registration and issues an acknowledgment before public-school withdrawal."
    assessment:
      required: false
      detail: "No state-mandated test or evaluation."
    subjects:
      required: false
      detail: "No subjects prescribed for this homeschool type."
    instruction_time:
      required: false
      detail: "No required minimum number of instructional days or hours."
    teacher_qualifications:
      required: false
      detail: "No diploma or teaching-license requirement; instruction is primarily by a parent or legal guardian."
    records:
      required: true
      detail: "Report annual aggregate attendance to DDOE by July 31 and enrollment by September 30; no state-required academic portfolio."
  - id: "multi-family"
    name: "Multi-family homeschool"
    summary: "Parents or guardians educate children from more than one family and designate a liaison for DDOE reporting."
    notice:
      required: true
      detail: "Register the homeschool and students with DDOE; file annual enrollment by September 30. Multi-family schools use a liaison."
    approval:
      required: false
      detail: "No instructional-program approval required; DDOE reviews registration and issues an acknowledgment before public-school withdrawal."
    assessment:
      required: false
      detail: "No state-mandated test or evaluation."
    subjects:
      required: false
      detail: "No subjects prescribed for this homeschool type."
    instruction_time:
      required: false
      detail: "No required minimum number of instructional days or hours."
    teacher_qualifications:
      required: false
      detail: "No diploma or teaching-license requirement; instruction is primarily by a parent or legal guardian."
    records:
      required: true
      detail: "Report annual aggregate attendance to DDOE by July 31 and enrollment by September 30; no state-required academic portfolio."
  - id: "district-coordinated"
    name: "Single-family homeschool coordinated with the local school district"
    summary: "A parent teaches at home using a curriculum approved by the local superintendent."
    notice:
      required: true
      detail: "Register the homeschool and students with DDOE; file annual enrollment by September 30. Multi-family schools use a liaison."
    approval:
      required: true
      detail: "Local superintendent must approve the curriculum and determine in writing that instruction will be regular and thorough."
    assessment:
      required: false
      detail: "No statewide test or evaluation requirement; the coordinated route may have local conditions."
    subjects:
      required: true
      detail: "Teach the subjects prescribed for public schools, using the superintendent-approved curriculum."
    instruction_time:
      required: false
      detail: "No statewide minimum days or hours; follow the approved curriculum in the coordinated route."
    teacher_qualifications:
      required: false
      detail: "No diploma or teaching-license requirement; instruction is primarily by a parent or legal guardian."
    records:
      required: true
      detail: "Report annual aggregate attendance to DDOE by July 31 and enrollment by September 30; no state-required academic portfolio."
funding:
  available: false
  detail: "No DDOE funding for Delaware homeschools."
public_school_access:
  available: false
  detail: "No statewide right to public-school classes or sports; public-school athletics require full-time enrollment."
claims:
  - field: "compulsory_ages"
    value: "Compulsory enrollment generally runs from five by August 31 until sixteen; public-school withdrawal has separate consent and exit-interview rules."
    quote: "a child between 5 and 16 years of age"
    provenance: "inferred"
    source_id: "de-attendance-homeschools"
    checked_on: "2026-11-05"
  - field: "compulsory_ages"
    value: "A homeschool need not be opened for a child sixteen or older."
    quote: "You do not have to open a homeschool with the DDOE if your child is 16 or older; however, we welcome and encourage you to do so."
    provenance: "measured"
    source_id: "de-nonpublic-registration"
    checked_on: "2026-11-05"
  - field: "funding"
    value: "No DDOE funding for Delaware homeschools."
    quote: "There is no funding provided by the DDOE for Delaware nonpublic schools."
    provenance: "measured"
    source_id: "de-nonpublic-faq"
    checked_on: "2026-11-05"
  - field: "public_school_access"
    value: "No guaranteed part-time or sports access; DIAA public-school athletics require full-time enrollment."
    quote: "Delaware Interscholastic Athletic Association (DIAA) regulations 1008 and 1009 require that in order for a student to represent a school in interscholastic athletics they must be enrolled at that school as a full-time student and the school must be a member school of the DIAA."
    provenance: "inferred"
    source_id: "de-nonpublic-faq"
    checked_on: "2026-11-05"
  - field: "pathways.single-family.notice"
    value: "Register the homeschool and students with DDOE; file annual enrollment by September 30. Multi-family schools use a liaison."
    quote: "Such persons shall also submit annually, no later than September 30, a statement of pupil enrollment on such forms as prescribed by the Department of Education."
    provenance: "measured"
    source_id: "de-attendance-homeschools"
    checked_on: "2026-11-05"
  - field: "pathways.single-family.approval"
    value: "No instructional-program approval required; DDOE reviews registration and issues an acknowledgment before public-school withdrawal."
