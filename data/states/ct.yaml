  - field: "pathways.equivalent-instruction.notice"
    value: "Public Act 26-37 replaces the equivalent-instruction attendance statute effective July 1, 2027, not during the current 2026–27 year."
    quote: "Section 1. Section 10 -184 of the general statutes is repealed and the following is substituted in lieu thereof (Effective July 1, 2027):"
