code: "CT"
name: "Connecticut"
summary: "Parents may provide equivalent instruction in the subjects required by law. In 2026 there is no mandatory homeschool notice or annual test; enacted withdrawal and intent-form requirements begin in the 2027–28 and 2028–29 school years."
compulsory_ages:
  min: 5
  max: 17
pathways:
  - id: "equivalent-instruction"
    name: "Equivalent instruction"
    summary: "A parent provides instruction elsewhere that is equivalent to the studies taught in public school."
    notice:
      required: false
      detail: "No mandatory homeschool notice in 2026; SDE recommends district notification. New withdrawal rules start July 2027 and annual intent forms July 2028."
    approval:
      required: false
      detail: "No prior program approval in 2026; parents must be able to show equivalent instruction. New public-school withdrawal conditions begin July 2027."
    assessment:
      required: false
      detail: "No mandatory annual tests or portfolio review; parents must be able to show equivalent instruction."
    subjects:
      required: true
      detail: "Reading, writing, spelling, English grammar, geography, arithmetic, U.S. history and citizenship, including town, state and federal government."
    instruction_time:
      required: false
      detail: "No homeschool-specific minimum days or hours; provide equivalent instruction."
    teacher_qualifications:
      required: false
      detail: "No parent diploma or teaching-license requirement specified."
    records:
      required: false
      detail: "No mandatory homeschool attendance log or portfolio in 2026; SDE recommends both to document instruction."
funding:
  available: false
  detail: "No state homeschool expense account, reimbursement or homeschool tax benefit."
public_school_access:
  available: false
  detail: "No statewide right to public-school classes or sports; local policies govern access."
claims:
  - field: "compulsory_ages"
    value: "Attendance applies from five until eighteen; parents may defer at ages five and six by signing a district option form."
    quote: "a child five years of age and over and under eighteen years of age"
    provenance: "measured"
    source_id: "ct-equivalent-instruction"
    checked_on: "2026-11-05"
  - field: "compulsory_ages"
    value: "A parent may defer attendance from five to six or from six to seven by personally signing a district option form."
    quote: "The parent or person shall exercise such option by personally appearing at the school district office and signing an option form."
    provenance: "measured"
    source_id: "ct-equivalent-instruction"
    checked_on: "2026-11-05"
  - field: "funding"
    value: "The equivalent-instruction exemption creates no homeschool expense funding or tax benefit."
    quote: "unless such child is a high school graduate or the parent or person having control of such child is able to show that the child is elsewhere receiving equivalent instruction in the studies taught in the public schools."
    provenance: "inferred"
    source_id: "ct-equivalent-instruction"
    checked_on: "2026-11-05"
